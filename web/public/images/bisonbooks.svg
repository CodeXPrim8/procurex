<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Black Background -->
  <rect width="200" height="150" fill="#000000"/>
  
  <!-- Orange Upward Trending Arrow/Graph (behind bull) -->
  <path d="M40 130 L55 115 L70 100 L85 80 L100 60 L115 45 L130 30 L145 20 L160 15 L175 10" 
        stroke="#FF6B35" 
        stroke-width="3.5" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <!-- Arrow head -->
  <path d="M175 10 L170 5 L175 10 L170 15" 
        stroke="#FF6B35" 
        stroke-width="3.5" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Dark Blue Bull Silhouette (facing right) -->
  <!-- Body -->
  <ellipse cx="110" cy="95" rx="35" ry="25" fill="#0F2F63"/>
  <!-- Head -->
  <ellipse cx="135" cy="85" rx="20" ry="18" fill="#0F2F63"/>
  <!-- Neck/Shoulder -->
  <path d="M110 95 Q125 90 135 85" stroke="#0F2F63" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Horns (curving upwards and forwards) -->
  <path d="M145 75 Q150 65 152 60 Q154 55 153 50" 
        stroke="#0F2F63" 
        stroke-width="5" 
        fill="none" 
        stroke-linecap="round"/>
  <path d="M148 78 Q153 68 155 63 Q157 58 156 53" 
        stroke="#0F2F63" 
        stroke-width="5" 
        fill="none" 
        stroke-linecap="round"/>
  <!-- Tail (curving upwards with tuft) -->
  <path d="M75 95 Q70 85 65 80 Q60 75 58 70" 
        stroke="#0F2F63" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round"/>
  <circle cx="58" cy="70" r="3" fill="#0F2F63"/>
  <!-- Legs -->
  <rect x="90" y="110" width="8" height="20" fill="#0F2F63"/>
  <rect x="110" y="110" width="8" height="20" fill="#0F2F63"/>
  <rect x="125" y="110" width="8" height="20" fill="#0F2F63"/>
  <rect x="145" y="110" width="8" height="20" fill="#0F2F63"/>
</svg>
